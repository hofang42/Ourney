name: iOS (unsigned IPA)

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'apps/mobile/ios/**'
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS runner for this manual build
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-26-intel

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    name: Build unsigned .ipa
    # Standard free runner for public repos (macOS 26, arm64). See docs/adr/0001.
    runs-on: ${{ inputs.macos_runner || 'macos-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write # needed only to attach the IPA to a GitHub Release on tags
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate localizations
        working-directory: apps/mobile
        run: |
          dart run tool/gen_l10n.dart
          git diff --exit-code

      # Optional build-time config. Secrets are passed via env (never interpolated into the script).
      # On release tags (v*), SUPABASE_URL and SUPABASE_ANON_KEY are mandatory (FS-34).
      # SUPPORT_EMAIL is only added when set (an empty key would be useless; the app falls back to its default).
      - name: Write dart-define file
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; }; then
            echo "::error::Release tag builds (v*) require SUPABASE_URL and SUPABASE_ANON_KEY secrets so production IPAs never ship in localOnly mode."
            exit 1
          fi
          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_ANON_KEY" ] || [ -n "$SUPPORT_EMAIL" ]; then
            jq -n --arg u "$SUPABASE_URL" --arg k "$SUPABASE_ANON_KEY" --arg e "$SUPPORT_EMAIL" \
              '(if $u != "" or $k != "" then {SUPABASE_URL: $u, SUPABASE_ANON_KEY: $k} else {} end)
               + (if $e != "" then {SUPPORT_EMAIL: $e} else {} end)' > "$RUNNER_TEMP/dart-defines.json"
            echo "DART_DEFINES_FILE=$RUNNER_TEMP/dart-defines.json" >> "$GITHUB_ENV"
          else
            echo "SUPABASE_*/SUPPORT_EMAIL secrets not set; building without --dart-define-from-file."
          fi

      - name: Build iOS (release, no codesign)
        working-directory: apps/mobile
        run: |
          args=(--release --no-codesign)
          if [ -n "${DART_DEFINES_FILE:-}" ] && [ -f "$DART_DEFINES_FILE" ]; then
            args+=("--dart-define-from-file=$DART_DEFINES_FILE")
          fi
          flutter build ios "${args[@]}"

      - name: Ad-hoc sign IPA bundles for re-signing
        working-directory: apps/mobile
        shell: bash
        run: |
          app=build/ios/iphoneos/Runner.app
          widget="$app/PlugIns/OurneyWidgetsExtension.appex"

          # Sign nested code before sealing its enclosing bundles.
          find "$app" -depth \( -type d -name '*.framework' -o -type f -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' nested; do
              codesign --force --sign - "$nested"
            done
          codesign --force --sign - --entitlements ios/OurneyWidgets/OurneyWidgets.entitlements "$widget"
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$app"

      - name: Verify IPA App Group entitlements
        working-directory: apps/mobile
        shell: bash
        run: |
          app=build/ios/iphoneos/Runner.app
          group=group.com.hofang42.ourney
          for bundle in "$app" "$app/PlugIns/OurneyWidgetsExtension.appex"; do
            if ! codesign -d --entitlements :- "$bundle" |
              plutil -convert json -o - - |
              jq -e --arg group "$group" '."com.apple.security.application-groups" | type == "array" and index($group) != null' >/dev/null; then
              echo "::error::Missing App Group $group in ${bundle##*/} signature."
              exit 1
            fi
            echo "Verified App Group $group in ${bundle##*/}."
          done

      - name: Verify AppIntents extract.actionsdata mangledTypeName
        working-directory: apps/mobile
        shell: bash
        run: |
          app=build/ios/iphoneos/Runner.app
          widget="$app/PlugIns/OurneyWidgetsExtension.appex"
          for bundle in "$app" "$widget"; do
            actions="$bundle/Metadata.appintents/extract.actionsdata"
            test -f "$actions" || { echo "::error::Missing $actions"; exit 1; }
            for intent in SelectTodayJourneyIntent SelectStreakJourneyIntent SelectSquadIntent SelectLockScreenJourneyIntent CycleTodayJourneyIntent; do
              jq -e --arg k "$intent" '
                any((.actions // {}) | to_entries[];
                  (.key == $k or (.key | endswith("." + $k))) and
                  (.value.mangledTypeName | strings | length > 0))
              ' "$actions" >/dev/null || {
                echo "::error::$intent missing or has empty mangledTypeName in $actions"
                exit 1
              }
            done
            for entity in JourneyWidgetEntity SquadWidgetEntity; do
              jq -e --arg k "$entity" '
                any((.entities // {}) | to_entries[];
                  (.key == $k or (.key | endswith("." + $k))) and
                  (.value.mangledTypeName | strings | length > 0))
              ' "$actions" >/dev/null || {
                echo "::error::$entity missing or has empty mangledTypeName in $actions"
                exit 1
              }
            done
            echo "Verified AppIntents mangledTypeName in ${bundle##*/}."
          done

      - name: Package IPA for re-signing
        run: scripts/ios/package_ipa.sh apps/mobile/build/ios/iphoneos/Runner.app Ourney-unsigned.ipa

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: Ourney-unsigned-ipa
          path: Ourney-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Test widget App Group, timelines, and snapshot behavior
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        timeout-minutes: 15
        working-directory: apps/mobile
        run: |
          flutter build ios --simulator --config-only
          device_id=$(xcrun simctl list devices available -j | jq -er \
            '[.devices | to_entries[] |
              select(.key | test("^com[.]apple[.]CoreSimulator[.]SimRuntime[.]iOS-")) |
              {version: (.key | split("iOS-")[1] | split("-") | map(tonumber)),
               phones: [.value[] | select(.name | startswith("iPhone"))]} |
              select(.phones | length > 0)] | sort_by(.version) | last | .phones[0].udid |
              select(type == "string" and length > 0)')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO -only-testing:RunnerTests/WidgetAppGroupTests \
            -only-testing:RunnerTests/WidgetTimelineProviderTests \
            -only-testing:RunnerTests/WidgetSnapshotRolloverTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Ourney-unsigned.ipa
          generate_release_notes: true
