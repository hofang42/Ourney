name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  core:
    name: ourney_core (dart test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ourney_core
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: |
          if [ -d test ]; then
            dart test
          else
            echo "No test/ directory yet in ourney_core; skipping dart test."
          fi

  mobile:
    name: apps/mobile (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: |
          if [ -f l10n.yaml ]; then
            flutter gen-l10n
          else
            echo "No l10n.yaml yet; skipping flutter gen-l10n."
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
