name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  core:
    name: ourney_core (dart test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ourney_core
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: |
          if [ -d test ]; then
            dart test
          else
            echo "No test/ directory yet in ourney_core; skipping dart test."
          fi

  supabase:
    name: supabase (pgTAP + edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # https://github.com/supabase/setup-cli
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # https://github.com/denoland/setup-deno
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Streak vectors in sync with contract
        run: deno run --allow-read supabase/scripts/check-streak-vectors.ts
      - name: Type-check edge functions
        run: deno check supabase/functions/*/index.ts
      - name: Test public journey metric redaction
        run: deno test supabase/functions/public-journey/index_test.ts
      - name: Test waitlist signup
        run: deno test supabase/functions/waitlist-signup/index_test.ts
      - name: Start Supabase (db, auth, storage, rest)
        run: supabase start -x studio,realtime,imgproxy,logflare,vector,mailpit,supavisor,postgres-meta,edge-runtime
      - name: pgTAP
        run: supabase test db
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  landing:
    name: Landing (fonts and waitlist)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Decode and shape WOFF2 fonts
        run: |
          python -m pip install 'fonttools[woff]==4.69.1' 'opentype-sanitizer==9.2.0' 'uharfbuzz==0.57.0'
          python apps/landing/scripts/landing-fonts.py
      - name: Check font rendering and waitlist in Chrome, Firefox and WebKit
        working-directory: apps/landing/scripts
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps firefox webkit
          for browser in chrome firefox webkit; do
            LANDING_BROWSER="$browser" node --test check-landing.mjs
          done

  tooling:
    name: repo tooling (shellcheck + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mobile release metadata against pubspec and migrations
        run: node scripts/release/metadata.mjs lint
      # A hand-resolved merge once left a bare `=======` in a pgTAP file.
      - name: No merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- ':!*.md'; then
            echo "::error::merge conflict markers found"
            exit 1
          fi
      # shellcheck and jq come preinstalled on ubuntu-latest.
      - name: shellcheck (scripts/**/*.sh)
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck
      # Also runs shellcheck on the `run:` blocks of every workflow.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Script tests (offline, stubbed gh/supabase/curl)
        run: bash scripts/tests/run.sh

  mobile:
    name: apps/mobile (codegen + analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Generated code is committed: regenerating must not change anything.
      - name: Codegen is up to date (build_runner)
        run: |
          dart run build_runner build -d
          git diff --exit-code --stat -- . || {
            echo "::error::Generated files are stale: run 'dart run build_runner build -d' in apps/mobile and commit."
            exit 1
          }
      - name: Localizations are up to date (all ARB sets)
        run: |
          dart run tool/gen_l10n.dart
          git diff --exit-code --stat -- . || {
            echo "::error::Generated l10n is stale: run 'dart run tool/gen_l10n.dart' in apps/mobile and commit."
            exit 1
          }
      - name: No uncommitted generated files
        run: |
          untracked="$(git ls-files --others --exclude-standard -- .)"
          if [ -n "$untracked" ]; then
            echo "::error::Generated files are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Analyze (flutter)
        run: flutter analyze
      # Only `dart analyze` runs the analyzer plugins (riverpod_lint).
      - name: Analyze (dart, riverpod_lint)
        run: dart analyze
      - name: Test
        run: flutter test

  admin:
    name: apps/admin (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & component tests (Vitest)
        run: npm test
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npm run build

