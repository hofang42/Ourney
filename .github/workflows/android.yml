name: Android (APK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed only to attach the APK to a GitHub Release on tags
    steps:
      - uses: actions/checkout@v7

      # AGP 9.x (android/settings.gradle.kts) requires JDK 17 minimum.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate localizations
        working-directory: apps/mobile
        run: |
          dart run tool/gen_l10n.dart
          git diff --exit-code

      # Release signing: required on v* release tags (FS-04); optional on manual workflow_dispatch.
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            if [ -z "${ANDROID_KEYSTORE_BASE64//[[:space:]]/}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD//[[:space:]]/}" ] || [ -z "${ANDROID_KEY_ALIAS//[[:space:]]/}" ] || [ -z "${ANDROID_KEY_PASSWORD//[[:space:]]/}" ]; then
              echo "::error::Release tag builds (v*) require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets."
              exit 1
            fi
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            python3 -c '
          import os, pathlib
          def esc(s):
              s = s.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")
              if s.startswith((" ", "\t", "\f")):
                  s = "\\" + s
              return s
          lines = [
              f"storeFile={esc(os.environ[\"RUNNER_TEMP\"])}/release.jks",
              f"storePassword={esc(os.environ.get(\"ANDROID_KEYSTORE_PASSWORD\", \"\"))}",
              f"keyAlias={esc(os.environ.get(\"ANDROID_KEY_ALIAS\", \"\"))}",
              f"keyPassword={esc(os.environ.get(\"ANDROID_KEY_PASSWORD\", \"\"))}",
          ]
          pathlib.Path("apps/mobile/android/key.properties").write_text("\n".join(lines) + "\n", encoding="utf-8")
          '
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; APK will be debug-signed."
          fi

      - name: Write dart-define file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        # SUPPORT_EMAIL is only added when set (the app falls back to its default otherwise).
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; }; then
            echo "::error::Release tag builds (v*) require SUPABASE_URL and SUPABASE_ANON_KEY secrets so production APKs never ship in localOnly mode."
            exit 1
          fi
          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_ANON_KEY" ] || [ -n "$SUPPORT_EMAIL" ]; then
            jq -n --arg u "$SUPABASE_URL" --arg k "$SUPABASE_ANON_KEY" --arg e "$SUPPORT_EMAIL" \
              '(if $u != "" or $k != "" then {SUPABASE_URL: $u, SUPABASE_ANON_KEY: $k} else {} end)
               + (if $e != "" then {SUPPORT_EMAIL: $e} else {} end)' > "$RUNNER_TEMP/dart-defines.json"
            echo "DART_DEFINES_FILE=$RUNNER_TEMP/dart-defines.json" >> "$GITHUB_ENV"
          fi

      - name: Build APK (release)
        working-directory: apps/mobile
        timeout-minutes: 25
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.workers.max=2
        run: |
          args=(--release --no-pub --no-android-gradle-daemon --verbose)
          if [ -n "${DART_DEFINES_FILE:-}" ] && [ -f "$DART_DEFINES_FILE" ]; then
            args+=("--dart-define-from-file=$DART_DEFINES_FILE")
          fi
          flutter build apk "${args[@]}"

      - name: Rename APK
        run: cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk Ourney.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Ourney-apk
          path: Ourney.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Ourney.apk
          generate_release_notes: true
