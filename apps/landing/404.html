<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>ourney · 404 · lạc đường một nhịp</title>
  <meta name="description" content="Trang bạn mở không tồn tại hoặc đã đổi địa chỉ. Quay về trang chủ Ourney nhé.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFF8EE" id="meta-theme-light" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1916" id="meta-theme-dark" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/assets/fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      var d = document.documentElement;
      try {
        if (sessionStorage.getItem('ourney-intro-seen') === '1') d.classList.add('intro-seen');
        var t = localStorage.getItem('ourney-theme');
        if (t === 'light' || t === 'dark') {
          d.dataset.theme = t;
          var m = t === 'dark' ? 'all' : 'not all';
          var mo = new MutationObserver(function () {
            var s = d.querySelectorAll('source.src-dark');
            for (var i = 0; i < s.length; i++) if (s[i].media !== m) s[i].media = m;
          });
          mo.observe(d, { childList: true, subtree: true });
          addEventListener('DOMContentLoaded', function () { mo.disconnect(); }, { once: true });
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="notfound-stage">
    <div class="wrap notfound-wrap">
      <div class="card notfound-card">
        <a class="brand" href="/" translate="no" aria-label="Ourney, về trang chủ" data-i18n-aria="nf_brand_aria" data-home-link>
          <img src="/assets/brand/wordmark.svg" alt="ourney" width="122" height="45">
        </a>
        <p class="eyebrow" data-i18n="nf_eyebrow">404 · không tìm thấy trang</p>
        <h1 data-i18n="nf_h1">lạc đường một nhịp</h1>
        <p class="lede" data-i18n="nf_lede">Trang bạn mở không tồn tại hoặc đã đổi địa chỉ. Quay về trang chủ Ourney nhé.</p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="/" data-home-link>
            <span data-i18n="nf_cta">về trang chủ ourney</span>
          </a>
        </div>
      </div>
    </div>
  </main>
  <script src="/main.js" defer></script>

</body>
</html>
