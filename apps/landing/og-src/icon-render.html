<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Ourney Brand App Icon Renderer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #FFF8EE;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-tile {
      width: 84%;
      height: 84%;
      background: #FFD84D;
      border: 5.5vw solid #1A1A1A;
      border-radius: 22%;
      box-shadow: 4.5vw 4.5vw 0 #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-1.8vw, -1.8vw);
    }
    svg {
      width: 74%;
      height: 74%;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="icon-tile">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28">
      <path d="M4 7.5h3l1.5-2h7l1.5 2h3v11H4Z" fill="#FFF8EE" stroke="#FFF8EE" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" paint-order="stroke fill"/>
      <path d="M4 7.5h3l1.5-2h7l1.5 2h3v11H4Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" paint-order="stroke fill"/>
      <path d="M4 7.5h3l1.5-2h7l1.5 2h3v11H4Z" fill="#10B981" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="13" r="3.6" fill="#FFF8EE" stroke="#1A1A1A" stroke-width="2.1"/>
      <circle cx="12" cy="13" r="1.4" fill="#1A1A1A"/>
      <circle cx="17" cy="9.8" r="1" fill="#FFF8EE"/>
    </svg>
  </div>
</body>
</html>
