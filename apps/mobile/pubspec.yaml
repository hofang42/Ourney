name: ourney
description: "Ourney - share your journeys"
publish_to: 'none'

# build-name -> CFBundleShortVersionString / versionName,
# build-number -> CFBundleVersion / versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  supabase_flutter: ^2.18.3
  camera: ^0.12.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  uuid: ^4.6.0
  confetti: ^0.8.0
  intl: ^0.20.3
  ourney_core:
    path: ../../packages/ourney_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true # flutter gen-l10n (l10n.yaml)

  fonts:
    # Body: Be Vietnam Pro (OFL), Vietnamese-complete.
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    # Display: Bricolage Grotesque (OFL), variable font (opsz, wdth, wght).
    # Weight is selected via FontVariation('wght', n) in displayStyle().
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
