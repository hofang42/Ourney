name: ourney
description: "Ourney - share your journeys"
publish_to: 'none'

# build-name -> CFBundleShortVersionString / versionName,
# build-number -> CFBundleVersion / versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.24.0'

# Every v1 dependency is declared here up front (plan 04 §1, task A3) so the
# Wave B/C feature agents never have to edit this file. Need something new?
# Ask the Orchestrator; do not add it in a feature PR.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Domain logic + repository contracts (pure Dart).
  ourney_core:
    path: ../../packages/ourney_core

  # State / DI (Riverpod with codegen) and routing.
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.0

  # Local DB / offline queue. sqlite3 3.x ships the native library through
  # build hooks; sqlite3_flutter_libs is EOL ("update to sqlite3 3.x") and is
  # intentionally not listed. drift_flutter opens the DB in a background isolate.
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Backend (only initialised when SUPABASE_URL/SUPABASE_ANON_KEY are defined).
  supabase_flutter: ^2.9.0
  # Background upload to Storage signed URLs (plan 04 §1, spike S4).
  background_downloader: ^9.2.0
  connectivity_plus: ^7.0.0

  # Capture + media.
  camera: ^0.11.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

  # Sharing, share card QR, external links (EULA/contact/landing).
  share_plus: ^12.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

  # Local reminders (rolling 14-day schedule) + device timezone.
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.0.0

  # Small key-value settings (onboarding done, last journey, haptics).
  shared_preferences: ^2.5.3

  # Misc.
  confetti: ^0.8.0
  uuid: ^4.6.0
  intl: ^0.20.2
  collection: ^1.19.1
  clock: ^1.1.2
  package_info_plus: ^9.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # riverpod_lint is an analysis_server_plugin: it is enabled under
  # `plugins:` in analysis_options.yaml, not as a dev dependency.
  build_runner: ^2.5.0
  riverpod_generator: ^4.0.0
  drift_dev: ^2.31.0
  mocktail: ^1.0.4
  shared_preferences_platform_interface: ^2.4.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  # Required by `flutter gen-l10n`. There is deliberately no l10n.yaml:
  # localizations are generated by `dart run tool/gen_l10n.dart` (one ARB set
  # per feature, see lib/features/README.md) and the output is committed.
  generate: true

  assets:
    - assets/design_personas/

  fonts:
    # Body: Be Vietnam Pro (OFL), Vietnamese-complete.
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    # Display: Bricolage Grotesque (OFL), variable font (opsz, wdth, wght).
    # Weight is selected via FontVariation('wght', n) in displayStyle().
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
